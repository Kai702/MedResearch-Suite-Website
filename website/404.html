<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | MedResearch Suite</title>
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0d1418">
<meta name="color-scheme" content="dark">
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/inter-400.woff2) format('woff2')}
  @font-face{font-family:'Poppins';font-style:normal;font-weight:800;font-display:swap;src:url(assets/fonts/poppins-800.woff2) format('woff2')}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0d1418;
    background-image:radial-gradient(60% 45% at 78% -6%, rgba(10,147,150,.18), transparent 62%),
                     radial-gradient(48% 38% at 4% 16%, rgba(0,95,115,.18), transparent 60%);
    color:#e6edf3; font-family:'Inter',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:24px; min-height:100%;
  }
  .wrap{max-width:34rem}
  .code{font-family:'Poppins',sans-serif; font-weight:800; letter-spacing:-.02em;
    font-size:clamp(4rem,3rem + 10vw,8rem); line-height:1;
    background:linear-gradient(135deg,#9be7cf,#0a9396); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent}
  h1{font-family:'Poppins',sans-serif; font-weight:800; font-size:clamp(1.4rem,1rem + 2vw,2rem);
    margin:14px 0 10px; letter-spacing:-.01em}
  p{color:#9fb1be; font-size:1rem; line-height:1.6; margin:0 auto 26px; max-width:30rem}
  a.home{display:inline-flex; align-items:center; gap:8px; text-decoration:none; font-weight:700;
    background:#0a9396; color:#04211f; padding:12px 22px; border-radius:8px; font-size:.95rem}
  a.home:hover{background:#0aa7ab}
</style>
</head>
<body>
  <main class="wrap">
    <div class="code">404</div>
    <h1>This page ran off the grid.</h1>
    <p>The page you are looking for does not exist, or has moved. Everything is still one click away.</p>
    <a class="home" href="/">Back to MedResearch Suite</a>
  </main>
</body>
</html>
